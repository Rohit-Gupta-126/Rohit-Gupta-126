<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Research: post-quantum cryptography, and security on photonic chips"><title>Research: post-quantum cryptography, and security on photonic chips</title><style>@font-face{font-family:"Departure Mono";src:url(data:font/woff2;base64,) format("woff2")}text{font-family:"Departure Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="0.5" y="0.5" width="999.0" height="229.0" rx="3" fill="#05070B" stroke="#18202D" stroke-width="1"/><rect x="24.5" y="24.5" width="467.0" height="181.0" rx="3" fill="#0B1018" stroke="#18202D" stroke-width="1"/><text x="48" y="56" font-size="11" fill="#38BDF8" text-anchor="start" letter-spacing="1.76">RESEARCH 01</text><text x="48" y="90" font-size="22" fill="#E8EDF5" text-anchor="start" letter-spacing="0.3">POST-QUANTUM CRYPTOGRAPHY</text><text x="48" y="124" font-size="13" fill="#A3B0C2" text-anchor="start">Quantum computers will break today's</text><text x="48" y="145" font-size="13" fill="#A3B0C2" text-anchor="start">encryption. I find it and replace it.</text><rect x="48.5" y="160.5" width="122.9" height="23.0" rx="3" fill="#0A0E15" stroke="#18202D" stroke-width="1"/><text x="57" y="176" font-size="10" fill="#A3B0C2" text-anchor="start" letter-spacing="1.2">LATTICE CRYPTO</text><rect x="180.4" y="160.5" width="85.1" height="23.0" rx="3" fill="#0A0E15" stroke="#18202D" stroke-width="1"/><text x="188.89090909090908" y="176" font-size="10" fill="#A3B0C2" text-anchor="start" letter-spacing="1.2">MIGRATION</text><rect x="274.5" y="160.5" width="115.3" height="23.0" rx="3" fill="#0A0E15" stroke="#18202D" stroke-width="1"/><text x="282.96363636363634" y="176" font-size="10" fill="#A3B0C2" text-anchor="start" letter-spacing="1.2">ARGUS LATTICE</text><rect x="508.5" y="24.5" width="467.0" height="181.0" rx="3" fill="#0B1018" stroke="#18202D" stroke-width="1"/><text x="532" y="56" font-size="11" fill="#38BDF8" text-anchor="start" letter-spacing="1.76">RESEARCH 02</text><text x="532" y="90" font-size="22" fill="#E8EDF5" text-anchor="start" letter-spacing="0.3">SECURITY ON PHOTONIC CHIPS</text><text x="532" y="124" font-size="13" fill="#A3B0C2" text-anchor="start">Chips that compute with light. I study</text><text x="532" y="145" font-size="13" fill="#A3B0C2" text-anchor="start">how to build security into the chip.</text><rect x="532.5" y="160.5" width="145.6" height="23.0" rx="3" fill="#0A0E15" stroke="#18202D" stroke-width="1"/><text x="541" y="176" font-size="10" fill="#A3B0C2" text-anchor="start" letter-spacing="1.2">SILICON PHOTONICS</text><rect x="687.1" y="160.5" width="138.0" height="23.0" rx="3" fill="#0A0E15" stroke="#18202D" stroke-width="1"/><text x="695.5818181818182" y="176" font-size="10" fill="#A3B0C2" text-anchor="start" letter-spacing="1.2">ON-CHIP SECURITY</text></svg>